# Kidney SCP browser. Generated by Claude Code.
# Data folder built by the data build script of the kidney browser.
title: "Single-cell proteomics browser: mouse kidney"
short_title: "SCP browser: mouse kidney"
page_icon: "🔬"
dataset_label: "Total mouse kidney (SCP-MS)"
data_dir: data/kidney
about: kidney_about.md
default_label_set: cell_type
default_protein: Slc12a3
min_proteins_per_cell: 100
intro: >-
  Single-cell proteomics (SCP-MS) of the total mouse kidney. Choose cell types in the sidebar; the pages
  on the left show protein detection by cell type, single proteins, the UMAP, marker dotplots, per-cell QC
  and downloads.

# One label set: the cell types reported in the manuscript.
label_sets:
  cell_type:
    name: "Cell types"
    description: >-
      Leiden 2.0 clusters on the stored graph, each named from its differential proteins and the V3
      markers plus an endothelial row. Cells of clusters without marker evidence are Unknown.
    display:
      DCT1: DCT
      PC: CNT/PC
    full_names:
      Endothelial: "Endothelial cells"
      JG: "Juxtaglomerular cells"
      PCT: "Proximal convoluted tubule"
      PST: "Proximal straight tubule"
      TAL: "Thick ascending limb of the loop of Henle"
      DCT1: "Distal convoluted tubule (label code DCT1)"
      PC: "Connecting tubule / principal cells (label code PC)"
      IC-B: "Intercalated cells, type B"
      Unknown: "Clusters without a marker among their differential proteins"

cluster_table:
  title: "Clusters and their marker evidence"
  label_set: cell_type
  display_columns: [top25_label]   # same label codes, shown with the cell-type display names
  help: >-
    One row per Leiden 2.0 cluster. Differential proteins: each cluster against all other cells.
    A cluster is named after the cell type whose V3 (or endothelial-row) markers are among its top 25
    differential proteins. Evidence: 'high' = at least one type-specific marker and marker enrichment
    q < 0.05; 'medium' = a type-specific marker, q ≥ 0.05; 'low_shared_only' = only markers that two or
    more types list. Clusters without a marker in the top 25 are rescued when a type-specific marker is
    significantly up at any rank ('specific_any_rank'; markers with rank, AUC, q and detection are
    listed); otherwise they are Unknown.
  columns:
    cluster: "Cluster"
    n_cells: "Cells"
    cell_type: "Cell type"
    cluster_evidence: "Evidence"
    top25_label: "Cell type from top-25 DE proteins"
    top25_confidence: "Top-25 evidence"
    top25_overlap: "Markers in top 25"
    rescued: "Rescued"
    rescue_markers: "Rescue markers (rank; AUC; q; detected in cluster vs rest)"
    median_protein_ids: "Median proteins per cell"

preset_group_label_set:
  "Cell-type markers: up to 3 per cell type": cell_type
  "Cell-type markers: all, each under one cell type": cell_type

# Extra per-cell columns shown in the Cells & UMAP table.
cell_extra_columns: [cluster, cluster_evidence]

default_dotplot_list: "Slc12a3, Pvalb, Calb1, Slc12a1, Umod, Lrp2, Aqp3, Pecam1"

qc_metrics:
  n_proteins: "Proteins per cell"
  dynamic_range_log10: "Dynamic range (log10)"
  total_intensity: "Total intensity"
  mitocarta_intensity_fraction: "MitoCarta3.0 intensity fraction"
qc_log_metrics: [total_intensity]
